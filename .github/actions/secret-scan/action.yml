name: Secret Scan
description: >
  Checks out the repo with full history and runs gitleaks to find committed secrets.
  On pull requests it scans only the PR's commits; on any other trigger (e.g. the weekly
  schedule) it scans the whole git history, which is what Trivy's filesystem scan cannot
  do (it only sees the tip tree, so a secret added and later removed is invisible to it).
  The gitleaks binary is downloaded at a pinned version and verified against an embedded
  SHA-256 before use. Known/accepted findings go in a repo-root `.gitleaksignore`
  (one fingerprint per line, with a comment saying why).

inputs:
  log_opts:
    description: >
      Override the `git log` options gitleaks scans (e.g. `origin/main..HEAD`). Empty means
      the PR's commit range on pull_request events and the full history otherwise.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout code (full history)
      uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0

    - name: Install gitleaks (checksum-verified)
      shell: bash
      run: |
        set -euo pipefail
        VERSION=8.30.1
        case "$(uname -m)" in
          x86_64)        ARCH=x64;   SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
          aarch64|arm64) ARCH=arm64; SHA256=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
          *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
        esac
        DEST="${RUNNER_TOOL_CACHE:-$HOME/.cache}/gitleaks/$VERSION/$ARCH"
        if [ ! -x "$DEST/gitleaks" ]; then
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # Redirect stdout instead of `curl -o` (snap-packaged curl can't write arbitrary paths).
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_${ARCH}.tar.gz" > "$tmp/gitleaks.tar.gz"
          echo "${SHA256}  $tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$DEST"
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$DEST" gitleaks
        fi
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Scan for secrets
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        LOG_OPTS_INPUT: ${{ inputs.log_opts }}
      run: |
        set -euo pipefail
        if [ -n "$LOG_OPTS_INPUT" ]; then
          LOG_OPTS="$LOG_OPTS_INPUT"
        elif [ "$EVENT_NAME" = "pull_request" ]; then
          LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
        else
          LOG_OPTS="--all"
        fi
        echo "Scanning git history with: --log-opts=$LOG_OPTS"
        # --redact keeps secret values out of the CI log; fingerprints are still printed so
        # an accepted finding can be added to .gitleaksignore.
        gitleaks git --no-banner --redact --verbose --exit-code 1 --log-opts="$LOG_OPTS" .
