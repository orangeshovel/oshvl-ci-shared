name: Trivy Scan
description: >
  Checks out the repo and runs a Trivy filesystem scan (vulnerabilities,
  secrets, and IaC misconfigurations) against it. Fails the job on findings at
  or above the configured severity. Defaults are tuned for the oshvl repos
  (Python apps with requirements.txt, Terraform, Ansible); consumers override
  via inputs and a repo-root .trivyignore. Intended to be called from a thin
  per-repo workflow with no `paths:` filter so it runs on every PR.

inputs:
  scan_path:
    description: Path to scan, relative to the repo root
    required: false
    default: "."
  severity:
    description: >
      Override comma-separated severities that count as findings. Empty uses
      the shared trivy.yaml (HIGH,CRITICAL).
    required: false
    default: ""
  scanners:
    description: >
      Override comma-separated Trivy scanners. Empty uses the shared trivy.yaml
      (vuln,secret,misconfig).
    required: false
    default: ""
  skip_dirs:
    description: >
      Override comma-separated directories to skip (use `**/name` to match at
      any depth). Empty uses the shared trivy.yaml (venvs, staticfiles,
      node_modules, .git at any depth).
    required: false
    default: ""
  exit_code:
    description: >
      Override the exit code when findings are present (0 = report only).
      Empty uses the shared trivy.yaml (1 = fail the job).
    required: false
    default: ""
  trivyignores:
    description: >
      Path to a .trivyignore file. If the file does not exist it is skipped
      (trivy-action itself errors on a missing file).
    required: false
    default: ".trivyignore"

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Resolve ignore file
      id: ignorefile
      shell: bash
      env:
        IGNORE_PATH: ${{ inputs.trivyignores }}
      run: |
        if [ -n "$IGNORE_PATH" ] && [ -f "$IGNORE_PATH" ]; then
          echo "path=$IGNORE_PATH" >> "$GITHUB_OUTPUT"
        else
          echo "path=" >> "$GITHUB_OUTPUT"
        fi

    # Pinned to an exact release: trivy-action publishes no floating major tag
    # (only vX.Y.Z), and a scanner running with repo access on our runners is
    # worth bumping deliberately. Settings come from trivy.yaml next to this
    # action; trivy-action only sets an env override when an input is non-empty
    # and differs from its own default, so empty inputs fall through to the file.
    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.scan_path }}
        trivy-config: ${{ github.action_path }}/trivy.yaml
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        skip-dirs: ${{ inputs.skip_dirs }}
        exit-code: ${{ inputs.exit_code }}
        trivyignores: ${{ steps.ignorefile.outputs.path }}
        output: ${{ runner.temp }}/trivy-report.txt

    # The scan writes its table to a file (above) so it can be shown twice: in the
    # job log and on the run's summary page. Runs even when the scan failed on
    # findings; if the scan died before writing a report (tool error) there is
    # nothing to show and the failed scan step above has the error.
    - name: Show Trivy report
      if: always()
      shell: bash
      env:
        REPORT: ${{ runner.temp }}/trivy-report.txt
      run: |
        [ -f "$REPORT" ] || exit 0
        cat "$REPORT"
        {
          echo "## Trivy scan"
          echo
          if [ -s "$REPORT" ] && grep -q '[^[:space:]]' "$REPORT"; then
            echo '```'
            # Job summaries are capped at 1 MiB; keep well under it.
            head -c 500000 "$REPORT"
            echo
            echo '```'
          else
            echo "No findings."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        rm -f "$REPORT"
